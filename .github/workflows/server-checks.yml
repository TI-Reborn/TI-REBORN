name: Server checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  server-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository boundary
        run: python tools/check_handoff.py
      - name: Validate server resources
        run: python -m server --check
      - name: Install gateway test dependencies
        run: python -m pip install -r registration/requirements.txt
      - name: Generate local TLS test fixtures
        shell: pwsh
        run: ./tests/fixtures/game_tls/generate.ps1
      - name: Run server baseline
        run: python tools/run_server_checks.py
