[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tio-emulator"
version = "0.1.0"
description = "Evidence-led Total Influence application protocol research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["pefile==2024.8.26", "capstone==5.0.9", "unicorn==2.1.4", "frida==17.17.0"]

[tool.setuptools.packages.find]
include = ["tio*"]
